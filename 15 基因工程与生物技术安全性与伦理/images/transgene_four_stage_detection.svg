<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <linearGradient id="head-tfs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <filter id="shadow-tfs" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="780" height="370" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <g transform="translate(15, 12)">
    <rect width="750" height="38" rx="8" fill="url(#head-tfs)"/>
    <text x="375" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      目的基因四级检测与鉴定递进阶梯（分子水平三级 + 个体水平一级）
    </text>
  </g>

  <!-- 左大区：分子水平检测 (三级递进) -->
  <g transform="translate(15, 60)">
    <rect width="470" height="295" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" filter="url(#shadow-tfs)"/>
    <rect x="0" y="0" width="470" height="30" rx="10" fill="#2563eb"/>
    <text x="235" y="20" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
      分子水平检测（Molecular Level：三大递进层级）
    </text>

    <!-- 1级：染色体插入 -->
    <g transform="translate(15, 40)">
      <rect width="440" height="68" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#1e40af">① 染色体 DNA 是否插入目的基因（有无基因）</text>
      <text x="10" y="34" font-family="system-ui, sans-serif" font-size="9" fill="#334155">• 方法：【PCR 扩增技术】 或 【DNA 分子杂交技术】 (利用放射性/荧光标记 DNA 探针)</text>
      <text x="10" y="48" font-family="system-ui, sans-serif" font-size="9" fill="#334155">• 结果：出现特异性 PCR 扩增产物带，或膜上呈现杂交杂交带</text>
      <text x="10" y="60" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">意义：证实目的基因已成功整合进受体细胞基因组染色体中</text>
    </g>

    <!-- 2级：转录 mRNA -->
    <g transform="translate(15, 116)">
      <rect width="440" height="68" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#1e40af">② 目的基因是否转录出 mRNA（有无转录产物）</text>
      <text x="10" y="34" font-family="system-ui, sans-serif" font-size="9" fill="#334155">• 方法：【RT-PCR (逆转录 PCR)】 或 【分子杂交技术】 (DNA-RNA 探针分子杂交)</text>
      <text x="10" y="48" font-family="system-ui, sans-serif" font-size="9" fill="#334155">• 结果：逆转录产物成功扩增，或检测到特异性杂交信号</text>
      <text x="10" y="60" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">意义：证实受体细胞转录机制成功启动，启动子具有转录活性</text>
    </g>

    <!-- 3级：翻译蛋白质 -->
    <g transform="translate(15, 192)">
      <rect width="440" height="92" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#1e40af">③ 目的基因是否翻译出相应蛋白质（有无翻译产物）</text>
      <text x="10" y="36" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#dc2626">• 方法：【抗原-抗体杂交技术】 (Western Blot)</text>
      <text x="10" y="52" font-family="system-ui, sans-serif" font-size="9" fill="#334155">• 原理：利用特定单克隆抗体与目的蛋白质发生抗原-抗体特异性结合反应</text>
      <text x="10" y="68" font-family="system-ui, sans-serif" font-size="9" fill="#334155">• 结果：显色出现特异性杂交显色条带</text>
      <text x="10" y="82" font-family="system-ui, sans-serif" font-size="8" fill="#2563eb">意义：证实蛋白质分子已成功翻译合成！</text>
    </g>
  </g>

  <!-- 右侧：个体水平鉴定 -->
  <g transform="translate(500, 60)">
    <rect width="265" height="295" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.2" filter="url(#shadow-tfs)"/>
    <rect x="0" y="0" width="265" height="30" rx="10" fill="#16a34a"/>
    <text x="132.5" y="20" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
      个体水平鉴定（Individual Level）
    </text>

    <g transform="translate(12, 40)">
      <rect width="241" height="52" rx="6" fill="#f0fdf4" stroke="#86efac"/>
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#15803d">④ 个体是否呈现预期抗性性状</text>
      <text x="10" y="34" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">最终终极金标准：是否具有抗性表型</text>
    </g>

    <g transform="translate(12, 100)">
      <rect width="241" height="135" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">经典高考实践应用方法：</text>
      <text x="10" y="36" font-family="system-ui, sans-serif" font-size="9" fill="#334155">1. 【抗虫鉴定】：</text>
      <text x="20" y="50" font-family="system-ui, sans-serif" font-size="8.5" fill="#059669">接种棉铃虫 ➔ 观察棉铃虫是否死亡</text>
      <text x="10" y="68" font-family="system-ui, sans-serif" font-size="9" fill="#334155">2. 【抗病鉴定】：</text>
      <text x="20" y="82" font-family="system-ui, sans-serif" font-size="8.5" fill="#059669">接种病原真菌 ➔ 观察病斑发生率</text>
      <text x="10" y="100" font-family="system-ui, sans-serif" font-size="9" fill="#334155">3. 【抗除草剂】：</text>
      <text x="20" y="114" font-family="system-ui, sans-serif" font-size="8.5" fill="#059669">喷洒草甘膦 ➔ 植株正常存活即成功</text>
    </g>

    <g transform="translate(12, 245)">
      <rect width="241" height="40" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
      <text x="120.5" y="24" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#dc2626" text-anchor="middle">
        考点：翻译出蛋白质不等于个体一定有抗性！
      </text>
    </g>
  </g>
</svg>
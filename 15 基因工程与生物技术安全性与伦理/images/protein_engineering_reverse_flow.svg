<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <linearGradient id="head-pef" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="shadow-pef" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="780" height="370" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <g transform="translate(15, 12)">
    <rect width="750" height="38" rx="8" fill="url(#head-pef)"/>
    <text x="375" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      蛋白质工程标准逆向工作流程（反向推导与基因改造）
    </text>
  </g>

  <!-- 5 阶段卡片横向排布 -->
  <g transform="translate(15, 60)">
    <rect width="750" height="295" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow-pef)"/>

    <!-- 1. 预期功能 -->
    <g transform="translate(20, 20)">
      <rect width="125" height="190" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
      <rect x="0" y="0" width="125" height="28" rx="8" fill="#dc2626"/>
      <text x="62.5" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">
        1. 预期功能
      </text>
      <g transform="translate(8, 38)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#b91c1c">逻辑起点：</text>
        <text x="0" y="34" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">立足人类实践需求</text>
        <text x="0" y="50" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">确定蛋白质预期的</text>
        <text x="0" y="66" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#dc2626">生物学新功能</text>
        <text x="0" y="86" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">(如耐热工业酶、速效胰岛素、靶向抗体)</text>
      </g>
    </g>

    <g transform="translate(152, 115)"><text x="0" y="0" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#94a3b8">➔</text></g>

    <!-- 2. 设计空间结构 -->
    <g transform="translate(168, 20)">
      <rect width="130" height="190" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
      <rect x="0" y="0" width="130" height="28" rx="8" fill="#ea580c"/>
      <text x="65" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">
        2. 设计三维结构
      </text>
      <g transform="translate(8, 38)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#c2410c">反向结构推导：</text>
        <text x="0" y="34" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">根据预期功能，</text>
        <text x="0" y="50" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">计算机辅助设计</text>
        <text x="0" y="66" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#ea580c">三维空间折叠构象</text>
        <text x="0" y="86" font-family="system-ui, sans-serif" font-size="8" fill="#475569">推导必需的α螺旋、β折叠与二硫键位点</text>
      </g>
    </g>

    <g transform="translate(305, 115)"><text x="0" y="0" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#94a3b8">➔</text></g>

    <!-- 3. 推测氨基酸序列 -->
    <g transform="translate(321, 20)">
      <rect width="135" height="190" rx="8" fill="#fffbeb" stroke="#fde68a"/>
      <rect x="0" y="0" width="135" height="28" rx="8" fill="#d97706"/>
      <text x="67.5" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">
        3. 推测氨基酸序列
      </text>
      <g transform="translate(8, 38)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#b45309">一级结构逆推：</text>
        <text x="0" y="34" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">由三维空间构象</text>
        <text x="0" y="50" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">进一步反向推导</text>
        <text x="0" y="66" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#b45309">应有的氨基酸种类</text>
        <text x="0" y="82" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#b45309">与精确排列顺序</text>
      </g>
    </g>

    <g transform="translate(463, 115)"><text x="0" y="0" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#94a3b8">➔</text></g>

    <!-- 4. 找到改造对应基因 -->
    <g transform="translate(479, 20)">
      <rect width="135" height="190" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
      <rect x="0" y="0" width="135" height="28" rx="8" fill="#2563eb"/>
      <text x="67.5" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">
        4. 基因合成与改造
      </text>
      <g transform="translate(8, 38)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#1e40af">操作落脚点：</text>
        <text x="0" y="34" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">逆向翻译密码子</text>
        <text x="0" y="50" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#2563eb">找到并定点改造</text>
        <text x="0" y="66" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#2563eb">对应脱氧核苷酸</text>
        <text x="0" y="82" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">或人工化学全合成</text>
        <text x="0" y="98" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">★ 核心：直接改基因！</text>
      </g>
    </g>

    <g transform="translate(621, 115)"><text x="0" y="0" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#94a3b8">➔</text></g>

    <!-- 5. 表达新蛋白质 -->
    <g transform="translate(637, 20)">
      <rect width="95" height="190" rx="8" fill="#f0fdf4" stroke="#86efac"/>
      <rect x="0" y="0" width="95" height="28" rx="8" fill="#16a34a"/>
      <text x="47.5" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">
        5. 表达新蛋白
      </text>
      <g transform="translate(6, 38)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#15803d">正向表达：</text>
        <text x="0" y="34" font-family="system-ui, sans-serif" font-size="8" fill="#334155">转录与翻译</text>
        <text x="0" y="50" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#047857">生产出满足</text>
        <text x="0" y="64" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#047857">人类需求的新</text>
        <text x="0" y="78" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#047857">型蛋白质！</text>
      </g>
    </g>

    <!-- 底部高考高频命题眼卡片 -->
    <g transform="translate(20, 225)">
      <rect width="713" height="55" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="15" y="20" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#dc2626">★ 为什么不直接改造蛋白质分子本身？（高考大题必背！）</text>
      <text x="15" y="38" font-family="system-ui, sans-serif" font-size="9" fill="#334155">改造基因能够让改造后的遗传性状【稳定遗传】给下一代，且可以通过细胞转录翻译实现工程化源源不断大量合成！直接改蛋白质无法遗传且成本极高。</text>
    </g>
  </g>
</svg>
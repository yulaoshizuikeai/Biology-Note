<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <linearGradient id="head-cdt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow-cdt" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="780" height="370" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <g transform="translate(15, 12)">
    <rect width="750" height="38" rx="8" fill="url(#head-cdt)"/>
    <text x="375" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      细胞分裂图像“三看识别法”秒杀决策树（有丝 vs 减Ⅰ vs 减Ⅱ）
    </text>
  </g>

  <!-- 顶部起点：第一看 -->
  <g transform="translate(265, 58)">
    <rect width="250" height="42" rx="8" fill="#1e293b" stroke="#334155" filter="url(#shadow-cdt)"/>
    <text x="125" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      【第一看】：看染色体总数
    </text>
  </g>

  <!-- 第一看分支箭头 -->
  <g transform="translate(390, 100)">
    <line x1="0" y1="0" x2="-230" y2="40" stroke="#475569" stroke-width="2"/>
    <polygon points="-233,37 -233,43 -227,40" fill="#475569"/>

    <line x1="0" y1="0" x2="130" y2="40" stroke="#475569" stroke-width="2"/>
    <polygon points="133,37 133,43 127,40" fill="#475569"/>
  </g>

  <!-- 左支：奇数结果 -->
  <g transform="translate(45, 140)">
    <rect width="220" height="195" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" filter="url(#shadow-cdt)"/>
    <rect x="0" y="0" width="220" height="30" rx="8" fill="#dc2626"/>
    <text x="110" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
      奇数 (Odd Number)
    </text>
    <g transform="translate(10, 42)">
      <rect width="200" height="65" rx="6" fill="#ffffff" stroke="#fecaca"/>
      <text x="100" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">减数第二次分裂</text>
      <text x="100" y="48" font-family="system-ui, sans-serif" font-size="10.5" fill="#7f1d1d" text-anchor="middle">(前期Ⅱ 或 中期Ⅱ)</text>
    </g>
    <g transform="translate(10, 115)">
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="9" fill="#475569">• 同源染色体已在减Ⅰ分离</text>
      <text x="10" y="34" font-family="system-ui, sans-serif" font-size="9" fill="#475569">• 细胞内无同源染色体</text>
      <text x="10" y="50" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#b91c1c">• 注：减Ⅱ后期因着丝粒分裂</text>
      <text x="18" y="64" font-family="system-ui, sans-serif" font-size="8.5" fill="#b91c1c">染色体暂时加倍为偶数！</text>
    </g>
  </g>

  <!-- 右支：偶数继续【第二看】 -->
  <g transform="translate(390, 140)">
    <rect width="260" height="36" rx="6" fill="#0284c7" stroke="#0369a1"/>
    <text x="130" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
      偶数 ➔【第二看】：有无同源染色体
    </text>
  </g>

  <!-- 第二看分支箭头 -->
  <g transform="translate(520, 176)">
    <line x1="0" y1="0" x2="-140" y2="35" stroke="#475569" stroke-width="2"/>
    <polygon points="-143,32 -143,38 -137,35" fill="#475569"/>

    <line x1="0" y1="0" x2="110" y2="35" stroke="#475569" stroke-width="2"/>
    <polygon points="113,32 113,38 107,35" fill="#475569"/>
  </g>

  <!-- 无同源染色体 -->
  <g transform="translate(300, 215)">
    <rect width="180" height="120" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2" filter="url(#shadow-cdt)"/>
    <rect x="0" y="0" width="180" height="26" rx="8" fill="#ea580c"/>
    <text x="90" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">
      无同源染色体
    </text>
    <g transform="translate(8, 36)">
      <text x="82" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#c2410c" text-anchor="middle">减数第二次分裂</text>
      <text x="82" y="44" font-family="system-ui, sans-serif" font-size="10.5" fill="#9a3412" text-anchor="middle">(后期Ⅱ 或 末期Ⅱ)</text>
      <text x="10" y="68" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748b">虽然染色体数为偶数，但</text>
      <text x="10" y="80" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748b">细胞内无形态相同对子</text>
    </g>
  </g>

  <!-- 有同源染色体 ➔ 【第三看】 -->
  <g transform="translate(505, 215)">
    <rect width="260" height="120" rx="8" fill="#ecfdf5" stroke="#86efac" stroke-width="1.2" filter="url(#shadow-cdt)"/>
    <rect x="0" y="0" width="260" height="26" rx="8" fill="#059669"/>
    <text x="130" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">
      有同源染色体 ➔【第三看】：行为特征
    </text>
    <g transform="translate(10, 34)">
      <rect width="115" height="74" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="57.5" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">有特殊行为</text>
      <text x="57.5" y="30" font-family="system-ui, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">联会/四分体/分离</text>
      <text x="57.5" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">减数第一次分裂</text>
      <text x="57.5" y="66" font-family="system-ui, sans-serif" font-size="8" fill="#475569" text-anchor="middle">(前Ⅰ/中Ⅰ/后Ⅰ)</text>

      <rect x="125" y="0" width="115" height="74" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="182.5" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#047857" text-anchor="middle">无特殊行为</text>
      <text x="182.5" y="30" font-family="system-ui, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">着丝粒散/赤道/单体分</text>
      <text x="182.5" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#059669" text-anchor="middle">有丝分裂</text>
      <text x="182.5" y="66" font-family="system-ui, sans-serif" font-size="8" fill="#475569" text-anchor="middle">(前/中/后期)</text>
    </g>
  </g>
</svg>
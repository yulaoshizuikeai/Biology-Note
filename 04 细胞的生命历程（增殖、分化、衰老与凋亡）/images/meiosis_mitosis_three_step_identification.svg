<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <linearGradient id="head-mm3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow-mm3" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- 背景底板 -->
  <rect width="780" height="370" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 顶部标题 -->
  <g transform="translate(15, 12)">
    <rect width="750" height="38" rx="8" fill="url(#head-mm3)"/>
    <text x="375" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      高考细胞分裂图像“三看识别法”极速判定决策树
    </text>
  </g>

  <!-- 中间三列决策卡片 -->
  <g transform="translate(15, 60)">
    <!-- 第一步：看染色体奇偶 -->
    <g transform="translate(0, 0)">
      <rect width="240" height="205" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2" filter="url(#shadow-mm3)"/>
      <rect x="0" y="0" width="240" height="30" rx="8" fill="#2563eb"/>
      <text x="120" y="20" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
        【第一步】看染色体数目奇偶
      </text>
      <g transform="translate(14, 42)">
        <rect x="0" y="0" width="212" height="42" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
        <text x="10" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">奇数条染色体 (n)</text>
        <text x="10" y="32" font-family="system-ui, sans-serif" font-size="10" fill="#2563eb">➔ 必为【减数第二次分裂】</text>

        <rect x="0" y="52" width="212" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="69" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#334155">偶数条染色体 (2n/4n)</text>
        <text x="10" y="84" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">➔ 无法排除，进入【第二步】</text>

        <text x="2" y="112" font-family="system-ui, sans-serif" font-size="9.5" fill="#dc2626" font-weight="bold">★ 特殊特例排雷：</text>
        <text x="2" y="128" font-family="system-ui, sans-serif" font-size="9" fill="#475569">正常二倍体生物体细胞或减Ⅰ均为偶数；</text>
        <text x="2" y="142" font-family="system-ui, sans-serif" font-size="9" fill="#475569">雄蜂等单倍体生物需特殊对待。</text>
      </g>
    </g>

    <!-- 第二步：看有无同源染色体 -->
    <g transform="translate(255, 0)">
      <rect width="240" height="205" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.2" filter="url(#shadow-mm3)"/>
      <rect x="0" y="0" width="240" height="30" rx="8" fill="#059669"/>
      <text x="120" y="20" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
        【第二步】看有无同源染色体
      </text>
      <g transform="translate(14, 42)">
        <rect x="0" y="0" width="212" height="42" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
        <text x="10" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#047857">无同源染色体（形态大小各异）</text>
        <text x="10" y="32" font-family="system-ui, sans-serif" font-size="10" fill="#059669">➔ 必为【减数第二次分裂】</text>

        <rect x="0" y="52" width="212" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="69" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#334155">有同源染色体（成对存在）</text>
        <text x="10" y="84" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">➔ 无法排除，进入【第三步】</text>

        <text x="2" y="112" font-family="system-ui, sans-serif" font-size="9.5" fill="#047857" font-weight="bold">★ 判定秘诀：</text>
        <text x="2" y="128" font-family="system-ui, sans-serif" font-size="9" fill="#475569">同源染色体：形态大小基本相同、</text>
        <text x="2" y="142" font-family="system-ui, sans-serif" font-size="9" fill="#475569">一条来自父方、一条来自母方。</text>
      </g>
    </g>

    <!-- 第三步：看同源染色体特殊行为 -->
    <g transform="translate(510, 0)">
      <rect width="240" height="205" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2" filter="url(#shadow-mm3)"/>
      <rect x="0" y="0" width="240" height="30" rx="8" fill="#7c3aed"/>
      <text x="120" y="20" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
        【第三步】看同源染色体特殊行为
      </text>
      <g transform="translate(14, 42)">
        <rect x="0" y="0" width="212" height="42" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
        <text x="10" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#6d28d9">联会/四分体/成对排列/同源分离</text>
        <text x="10" y="32" font-family="system-ui, sans-serif" font-size="10" fill="#7c3aed">➔ 必为【减数第一次分裂】</text>

        <rect x="0" y="52" width="212" height="42" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
        <text x="10" y="69" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">无联会/着丝粒排列板上/单体分开</text>
        <text x="10" y="84" font-family="system-ui, sans-serif" font-size="10" fill="#dc2626">➔ 必为【有丝分裂】</text>

        <text x="2" y="112" font-family="system-ui, sans-serif" font-size="9.5" fill="#7c3aed" font-weight="bold">★ 核心分水岭：</text>
        <text x="2" y="128" font-family="system-ui, sans-serif" font-size="9" fill="#475569">只要存在同源联会配对或同源分离，</text>
        <text x="2" y="142" font-family="system-ui, sans-serif" font-size="9" fill="#475569">绝无可能为有丝分裂！</text>
      </g>
    </g>
  </g>

  <!-- 底部关键时期识别口诀条 -->
  <g transform="translate(15, 275)">
    <rect width="750" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <g transform="translate(14, 16)">
      <text x="0" y="14" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#0f172a">
        ★ 时期速判口诀：
      </text>
      <text x="0" y="34" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">
        【前期看散乱与联会】散乱有同源为有丝前；散乱无同源为减Ⅱ前；成对联会/四分体为减Ⅰ前。
      </text>
      <text x="0" y="52" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">
        【中期看赤道板排布】同源成对排两侧为减Ⅰ中；着丝粒单列排中央且有同源为有丝中；着丝粒单列但无同源为减Ⅱ中。
      </text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <linearGradient id="head-tfm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow-tfm" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- 背景底板 -->
  <rect width="780" height="370" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 顶部标题 -->
  <g transform="translate(15, 12)">
    <rect width="750" height="38" rx="8" fill="url(#head-tfm)"/>
    <text x="375" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      传统发酵三巨头（果酒、果醋、泡菜）核心工艺与代谢全景矩阵
    </text>
  </g>

  <!-- 中间三列对比卡片 -->
  <g transform="translate(15, 60)">
    <!-- 果酒制作 -->
    <g transform="translate(0, 0)">
      <rect width="240" height="215" rx="8" fill="#ffffff" stroke="#e11d48" stroke-width="1.2" filter="url(#shadow-tfm)"/>
      <rect x="0" y="0" width="240" height="30" rx="8" fill="#e11d48"/>
      <text x="120" y="20" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
        果酒制作（酵母菌）
      </text>
      <g transform="translate(12, 38)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#9f1239">菌种性质：<tspan font-weight="normal" fill="#334155">单细胞真菌（真核生物）</tspan></text>
        <text x="0" y="34" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#9f1239">代谢类型：<tspan font-weight="normal" fill="#334155">异养兼性厌氧型</tspan></text>
        <text x="0" y="52" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#9f1239">发酵温度：<tspan font-weight="bold" fill="#e11d48">18 ~ 30 ℃</tspan><tspan font-weight="normal" fill="#334155">（最适 28℃）</tspan></text>
        <text x="0" y="70" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#9f1239">核心反应：</text>
        <rect x="0" y="76" width="216" height="24" rx="4" fill="#fff1f2"/>
        <text x="6" y="92" font-family="system-ui, sans-serif" font-size="9" fill="#be123c">C₆H₁₂O₆ ➔ 2C₂H₅OH + 2CO₂ + 能量</text>
        <text x="0" y="118" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#9f1239">氧气与排气：</text>
        <text x="0" y="134" font-family="system-ui, sans-serif" font-size="9" fill="#475569">• 前期通氧大量繁殖，后期密闭发酵</text>
        <text x="0" y="150" font-family="system-ui, sans-serif" font-size="9" fill="#475569">• 产 CO₂ 膨胀，需定期拧松瓶盖放气</text>
        <text x="0" y="166" font-family="system-ui, sans-serif" font-size="9" fill="#e11d48">★ 严禁开盖以防杂菌进入！</text>
      </g>
    </g>

    <!-- 果醋制作 -->
    <g transform="translate(255, 0)">
      <rect width="240" height="215" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2" filter="url(#shadow-tfm)"/>
      <rect x="0" y="0" width="240" height="30" rx="8" fill="#d97706"/>
      <text x="120" y="20" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
        果醋制作（醋酸菌）
      </text>
      <g transform="translate(12, 38)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#92400e">菌种性质：<tspan font-weight="normal" fill="#334155">单细胞细菌（原核生物）</tspan></text>
        <text x="0" y="34" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#92400e">代谢类型：<tspan font-weight="bold" fill="#d97706">异养严格好氧型</tspan></text>
        <text x="0" y="52" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#92400e">发酵温度：<tspan font-weight="bold" fill="#d97706">30 ~ 35 ℃</tspan><tspan font-weight="normal" fill="#334155">（温度较高）</tspan></text>
        <text x="0" y="70" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#92400e">核心反应：</text>
        <rect x="0" y="76" width="216" height="24" rx="4" fill="#fffbeb"/>
        <text x="6" y="92" font-family="system-ui, sans-serif" font-size="9" fill="#b45309">C₂H₅OH + O₂ ➔ CH₃COOH + H₂O</text>
        <text x="0" y="118" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#92400e">氧气与排气：</text>
        <text x="0" y="134" font-family="system-ui, sans-serif" font-size="9" fill="#475569">• 自始至终必须持续通入无菌空气</text>
        <text x="0" y="150" font-family="system-ui, sans-serif" font-size="9" fill="#475569">• 只要中断通氧，醋酸菌立即死亡</text>
        <text x="0" y="166" font-family="system-ui, sans-serif" font-size="9" fill="#d97706">★ 糖源充足时直接将糖变为醋酸</text>
      </g>
    </g>

    <!-- 泡菜制作 -->
    <g transform="translate(510, 0)">
      <rect width="240" height="215" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.2" filter="url(#shadow-tfm)"/>
      <rect x="0" y="0" width="240" height="30" rx="8" fill="#059669"/>
      <text x="120" y="20" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
        泡菜制作（乳酸菌）
      </text>
      <g transform="translate(12, 38)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#065f46">菌种性质：<tspan font-weight="normal" fill="#334155">单细胞细菌（原核生物）</tspan></text>
        <text x="0" y="34" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#065f46">代谢类型：<tspan font-weight="bold" fill="#059669">异养严格厌氧型</tspan></text>
        <text x="0" y="52" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#065f46">发酵温度：<tspan font-weight="bold" fill="#059669">常温 16 ~ 20 ℃</tspan></text>
        <text x="0" y="70" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#065f46">核心反应：</text>
        <rect x="0" y="76" width="216" height="24" rx="4" fill="#ecfdf5"/>
        <text x="6" y="92" font-family="system-ui, sans-serif" font-size="9" fill="#047857">C₆H₁₂O₆ ➔ 2C₃H₆O₃ (乳酸) + 能量</text>
        <text x="0" y="118" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#065f46">氧气与排气：</text>
        <text x="0" y="134" font-family="system-ui, sans-serif" font-size="9" fill="#475569">• 坛沿水封阻断外界氧气（需常补水）</text>
        <text x="0" y="150" font-family="system-ui, sans-serif" font-size="9" fill="#475569">• 无气体产生！全程严格封闭无需放气</text>
        <text x="0" y="166" font-family="system-ui, sans-serif" font-size="9" fill="#059669">★ 亚硝酸盐变化呈现先增后降曲线</text>
      </g>
    </g>
  </g>

  <!-- 底部核心排雷口诀条 -->
  <g transform="translate(15, 285)">
    <rect width="750" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <g transform="translate(14, 14)">
      <text x="0" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">
        ★ 高考传统发酵核心考点速记口诀：
      </text>
      <text x="0" y="32" font-family="system-ui, sans-serif" font-size="10" fill="#334155">
        【气体辨析】果酒产气（CO₂ 需拧松瓶盖放气） vs 泡菜不产气（乳酸无气体，严密封闭切勿放气）！
      </text>
      <text x="0" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#334155">
        【原真辨析】酵母菌为真核（有核膜、线粒体）；醋酸菌与乳酸菌均为原核（无核膜，仅含核糖体一种细胞器）。
      </text>
    </g>
  </g>
</svg>

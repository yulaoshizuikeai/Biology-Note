<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <linearGradient id="head-atp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <filter id="shadow-atp" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="780" height="370" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <g transform="translate(15, 12)">
    <rect width="750" height="38" rx="8" fill="url(#head-atp)"/>
    <text x="375" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      ATP 分子微观拓扑结构拆解（A — P ~ P ~ P）
    </text>
  </g>

  <!-- 上半区：结构简式大图示 -->
  <g transform="translate(15, 60)">
    <rect width="750" height="155" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow-atp)"/>
    
    <!-- 腺苷 Adenosine -->
    <g transform="translate(25, 20)">
      <!-- 腺嘌呤 -->
      <rect width="110" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="55" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">腺嘌呤 (A)</text>
      <text x="55" y="48" font-family="system-ui, sans-serif" font-size="9" fill="#3b82f6" text-anchor="middle">含氮碱基</text>

      <!-- 连接键 -->
      <line x1="110" y1="50" x2="140" y2="50" stroke="#64748b" stroke-width="2"/>

      <!-- 核糖 -->
      <polygon points="175,20 215,35 200,75 150,75 135,35" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
      <text x="175" y="52" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#065f46" text-anchor="middle">核糖</text>
      <text x="175" y="66" font-family="system-ui, sans-serif" font-size="8.5" fill="#047857" text-anchor="middle">五碳糖</text>

      <!-- 腺苷整体括号 -->
      <path d="M 0 95 L 0 105 L 110 105 L 110 115 L 110 105 L 220 105 L 220 95" stroke="#2563eb" stroke-width="1.5" fill="none"/>
      <text x="110" y="130" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">腺苷 (Adenosine, A)</text>
    </g>

    <!-- 普通磷酸酯键 -->
    <g transform="translate(250, 60)">
      <line x1="0" y1="10" x2="45" y2="10" stroke="#475569" stroke-width="2"/>
      <text x="22.5" y="0" font-family="system-ui, sans-serif" font-size="9" fill="#475569" text-anchor="middle">普通磷酸酯键</text>
    </g>

    <!-- 3 个磷酸基团 -->
    <g transform="translate(300, 30)">
      <!-- P1 -->
      <circle cx="30" cy="40" r="24" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
      <text x="30" y="45" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#c2410c" text-anchor="middle">P₁</text>
      <text x="30" y="80" font-family="system-ui, sans-serif" font-size="9" fill="#475569" text-anchor="middle">第1磷酸基</text>

      <!-- 特殊化学键 1 (~) -->
      <text x="75" y="47" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#dc2626" text-anchor="middle">~</text>
      <text x="75" y="20" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626" text-anchor="middle">特殊化学键</text>

      <!-- P2 -->
      <circle cx="120" cy="40" r="24" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
      <text x="120" y="45" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#c2410c" text-anchor="middle">P₂</text>
      <text x="120" y="80" font-family="system-ui, sans-serif" font-size="9" fill="#475569" text-anchor="middle">第2磷酸基</text>

      <!-- 特殊化学键 2 (~) -->
      <text x="165" y="47" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#dc2626" text-anchor="middle">~</text>
      <text x="165" y="20" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#dc2626" text-anchor="middle">易水解断裂</text>

      <!-- P3 -->
      <circle cx="210" cy="40" r="24" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
      <text x="210" y="45" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">P₃</text>
      <text x="210" y="80" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#b91c1c" text-anchor="middle">末端磷酸基</text>

      <!-- 水解标注箭头 -->
      <path d="M 165 48 L 165 95 M 160 90 L 165 95 L 170 90" stroke="#dc2626" stroke-width="1.5" fill="none"/>
      <text x="165" y="112" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#dc2626" text-anchor="middle">ATP 水解释能 (形成 ADP + Pi)</text>
    </g>

    <!-- 右侧总结公式卡 -->
    <g transform="translate(565, 18)">
      <rect width="165" height="120" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text x="82.5" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">高考易错辨析点</text>
      <text x="10" y="42" font-family="system-ui, sans-serif" font-size="9" fill="#334155">• ATP 含有 1 个腺苷</text>
      <text x="10" y="60" font-family="system-ui, sans-serif" font-size="9" fill="#334155">• 含有 3 个磷酸基团</text>
      <text x="10" y="78" font-family="system-ui, sans-serif" font-size="9" fill="#334155">• 含有 2 个特殊化学键</text>
      <text x="10" y="96" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#dc2626">• 断裂 2 键 ➔ AMP</text>
      <text x="18" y="110" font-family="system-ui, sans-serif" font-size="8.5" fill="#b91c1c">(即腺嘌呤核糖核苷酸)</text>
    </g>
  </g>

  <!-- 下半区：三级衍生物关系表 -->
  <g transform="translate(15, 225)">
    <rect width="750" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <g transform="translate(20, 15)">
      <text x="0" y="15" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">ATP / ADP / AMP 相互转化关系链条：</text>
      
      <rect x="0" y="32" width="130" height="65" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="65" y="55" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">ATP (三磷酸腺苷)</text>
      <text x="65" y="72" font-family="system-ui, sans-serif" font-size="9" fill="#78350f" text-anchor="middle">高能转移势能货币</text>

      <text x="170" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">⇋ 水解/合成</text>

      <rect x="210" y="32" width="130" height="65" rx="6" fill="#e0e7ff" stroke="#6366f1"/>
      <text x="275" y="55" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#4338ca" text-anchor="middle">ADP (二磷酸腺苷)</text>
      <text x="275" y="72" font-family="system-ui, sans-serif" font-size="9" fill="#312e81" text-anchor="middle">含 1 个特殊化学键</text>

      <text x="380" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">⇋ 水解/合成</text>

      <rect x="420" y="32" width="150" height="65" rx="6" fill="#dcfce7" stroke="#10b981"/>
      <text x="495" y="52" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#065f46" text-anchor="middle">AMP (一磷酸腺苷)</text>
      <text x="495" y="68" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#047857" text-anchor="middle">= 腺嘌呤核糖核苷酸</text>
      <text x="495" y="82" font-family="system-ui, sans-serif" font-size="8" fill="#475569" text-anchor="middle">(RNA 基本构成单体之一)</text>

      <rect x="590" y="32" width="120" height="65" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
      <text x="650" y="55" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">腺苷 + 3 Pi</text>
      <text x="650" y="72" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">彻底水解产物</text>
    </g>
  </g>
</svg>
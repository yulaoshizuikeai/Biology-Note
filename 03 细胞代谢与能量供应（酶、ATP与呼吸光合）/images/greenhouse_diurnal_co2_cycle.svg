<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <linearGradient id="head-gdc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <filter id="shadow-gdc" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="780" height="370" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <g transform="translate(15, 12)">
    <rect width="750" height="38" rx="8" fill="url(#head-gdc)"/>
    <text x="375" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      一昼夜密闭温室大棚内 CO₂ 浓度波动曲线与拐点判决模型
    </text>
  </g>

  <!-- 左侧：曲线主图 -->
  <g transform="translate(15, 60)">
    <rect width="480" height="295" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow-gdc)"/>

    <g transform="translate(65, 30)">
      <!-- 坐标轴 -->
      <line x1="0" y1="210" x2="385" y2="210" stroke="#475569" stroke-width="1.5"/>
      <polygon points="385,207 391,210 385,213" fill="#475569"/>
      <text x="393" y="213" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="start">时间 t</text>

      <line x1="0" y1="210" x2="0" y2="10" stroke="#475569" stroke-width="1.5"/>
      <polygon points="-3,10 0,4 3,10" fill="#475569"/>
      <text x="6" y="4" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="start">大棚 CO₂ 浓度</text>

      <!-- 时间刻度 -->
      <text x="0" y="224" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">0 (子夜)</text>
      <line x1="90" y1="210" x2="90" y2="215" stroke="#94a3b8"/>
      <text x="90" y="224" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">6h (清晨)</text>
      <line x1="180" y1="210" x2="180" y2="215" stroke="#94a3b8"/>
      <text x="180" y="224" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">12h (正午)</text>
      <line x1="270" y1="210" x2="270" y2="215" stroke="#94a3b8"/>
      <text x="270" y="224" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">18h (傍晚)</text>
      <line x1="360" y1="210" x2="360" y2="215" stroke="#94a3b8"/>
      <text x="360" y="224" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">24h</text>

      <!-- CO2 波动曲线 -->
      <!-- 0点(y=110) 爬升至 6点D点最高(y=45)，再下降至 18点H点最低(y=165)，再上升至24点(y=95低于起点0点) -->
      <path d="M 0 110 C 30 90 60 45 90 45 C 135 45 150 120 180 135 C 210 150 240 165 270 165 C 315 165 335 115 360 95" stroke="#6366f1" stroke-width="3" fill="none"/>

      <!-- 起点 A (0点) -->
      <circle cx="0" cy="110" r="4" fill="#4338ca"/>
      <text x="8" y="114" font-family="system-ui, sans-serif" font-size="9" fill="#4338ca">A</text>

      <!-- D 点 (最高点 6h) -->
      <circle cx="90" cy="45" r="5" fill="#dc2626"/>
      <text x="98" y="32" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="start">D 点 (最高拐点)</text>
      <text x="98" y="18" font-family="system-ui, sans-serif" font-size="8.5" fill="#b91c1c" text-anchor="start">光合 = 呼吸</text>

      <!-- H 点 (最低点 18h) -->
      <circle cx="270" cy="165" r="5" fill="#047857"/>
      <text x="270" y="182" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">H 点 (最低拐点)</text>
      <text x="270" y="196" font-family="system-ui, sans-serif" font-size="8.5" fill="#065f46" text-anchor="middle">光合 = 呼吸</text>

      <!-- 终点 I (24h) -->
      <circle cx="360" cy="95" r="4" fill="#4338ca"/>
      <text x="370" y="99" font-family="system-ui, sans-serif" font-size="9" fill="#4338ca">I</text>

      <!-- 水平虚线对比 0点 与 24点 -->
      <line x1="0" y1="110" x2="360" y2="110" stroke="#94a3b8" stroke-dasharray="3,3"/>
      <text x="362" y="113" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">起始水平线</text>
    </g>
  </g>

  <!-- 右侧：考点破局与结论卡 -->
  <g transform="translate(510, 60)">
    <rect width="255" height="295" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow-gdc)"/>
    <text x="127.5" y="24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">
      高考核心审题与判定判据
    </text>

    <g transform="translate(12, 38)">
      <rect width="231" height="60" rx="6" fill="#fef2f2" stroke="#fecaca"/>
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">D 点与 H 点生理本质：</text>
      <text x="10" y="34" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#dc2626">两个拐点处：光合速率 ＝ 呼吸速率！</text>
      <text x="10" y="48" font-family="system-ui, sans-serif" font-size="8.5" fill="#475569">• D 点之前：呼吸 &gt; 光合 (CO₂持续积累)</text>
      <text x="10" y="58" font-family="system-ui, sans-serif" font-size="8.5" fill="#047857">• D~H 段：光合 &gt; 呼吸 (CO₂持续被消耗)</text>
    </g>

    <g transform="translate(12, 106)">
      <rect width="231" height="85" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#047857">一昼夜植株生长判定原则：</text>
      <text x="10" y="36" font-family="system-ui, sans-serif" font-size="9" fill="#334155">对比【24h (I点)】与【0h (A点)】CO₂ 浓度：</text>
      <text x="10" y="52" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#047857">1. 若 I &lt; A ➔ 大棚 CO₂ 减少 ➔ 植株净积累</text>
      <text x="18" y="64" font-family="system-ui, sans-serif" font-size="8" fill="#065f46">一昼夜能够正常生长增重！(上图所示)</text>
      <text x="10" y="76" font-family="system-ui, sans-serif" font-size="8.5" fill="#dc2626">2. 若 I = A ➔ 有机物总量不变</text>
      <text x="10" y="86" font-family="system-ui, sans-serif" font-size="8.5" fill="#dc2626">3. 若 I &gt; A ➔ 消耗大于积累，植株不能生长！</text>
    </g>

    <g transform="translate(12, 200)">
      <rect width="231" height="80" rx="6" fill="#fffbeb" stroke="#fde68a"/>
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#b45309">★ 正午“光合午休”现象：</text>
      <text x="10" y="34" font-family="system-ui, sans-serif" font-size="8.5" fill="#475569">夏季晴朗正午气孔关闭以减少水分散失</text>
      <text x="10" y="48" font-family="system-ui, sans-serif" font-size="8.5" fill="#475569">导致 CO₂ 供应不足，暗反应受阻</text>
      <text x="10" y="62" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#b45309">曲线在 12h 附近下降斜率变平缓！</text>
    </g>
  </g>
</svg>
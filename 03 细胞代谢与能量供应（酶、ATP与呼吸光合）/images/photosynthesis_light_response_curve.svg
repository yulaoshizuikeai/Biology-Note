<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <linearGradient id="head-lrc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <filter id="shadow-lrc" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="780" height="370" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <g transform="translate(15, 12)">
    <rect width="750" height="38" rx="8" fill="url(#head-lrc)"/>
    <text x="375" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      经典光照强度响应曲线四大特征点解构与代谢平衡
    </text>
  </g>

  <!-- 左侧：曲线图绘制 -->
  <g transform="translate(15, 60)">
    <rect width="460" height="295" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow-lrc)"/>

    <g transform="translate(60, 45)">
      <!-- X 轴 (y=140) -->
      <line x1="0" y1="140" x2="370" y2="140" stroke="#475569" stroke-width="1.5"/>
      <polygon points="370,137 376,140 370,143" fill="#475569"/>
      <text x="370" y="158" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="end">光照强度 (Light Intensity)</text>

      <!-- Y 轴 (x=0) -->
      <line x1="0" y1="210" x2="0" y2="10" stroke="#475569" stroke-width="1.5"/>
      <polygon points="-3,10 0,4 3,10" fill="#475569"/>
      <text x="-10" y="10" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="end">净光合速率</text>
      <text x="-8" y="143" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">0</text>

      <!-- 净光合响应曲线 -->
      <path d="M 0 200 C 60 170 100 140 120 140 C 180 80 240 50 280 50 L 360 50" stroke="#059669" stroke-width="3" fill="none"/>

      <!-- A 点：黑暗点 -->
      <circle cx="0" cy="200" r="5" fill="#dc2626"/>
      <text x="12" y="204" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">A 点 (黑暗点)</text>
      <line x1="-5" y1="200" x2="0" y2="200" stroke="#dc2626" stroke-width="1"/>
      <text x="-8" y="204" font-family="system-ui, sans-serif" font-size="9" fill="#dc2626" text-anchor="end">-R</text>

      <!-- B 点：光补偿点 -->
      <circle cx="120" cy="140" r="5" fill="#2563eb"/>
      <text x="120" y="130" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">B 点 (光补偿点)</text>
      <line x1="120" y1="140" x2="120" y2="150" stroke="#2563eb" stroke-width="1"/>

      <!-- C 点：光饱和点 -->
      <circle cx="280" cy="50" r="5" fill="#d97706"/>
      <text x="280" y="38" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#d97706" text-anchor="middle">C 点 (光饱和点)</text>
      <line x1="280" y1="50" x2="280" y2="140" stroke="#d97706" stroke-dasharray="3,3"/>
      
      <!-- 平台期标注 -->
      <text x="325" y="42" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">平台期 (最大光合)</text>

      <!-- 呼吸速率线 -->
      <line x1="0" y1="200" x2="360" y2="200" stroke="#fca5a5" stroke-dasharray="3,3"/>
      <text x="360" y="214" font-family="system-ui, sans-serif" font-size="8.5" fill="#dc2626" text-anchor="end">呼吸速率绝对值 |R|</text>
    </g>
  </g>

  <!-- 右侧：核心考点解构卡 -->
  <g transform="translate(490, 60)">
    <rect width="275" height="295" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow-lrc)"/>
    <text x="137.5" y="24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">
      三大特征点物理与生物学意义
    </text>

    <!-- A 点 -->
    <g transform="translate(12, 40)">
      <rect width="251" height="52" rx="6" fill="#fef2f2" stroke="#fecaca"/>
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">A 点 (光强 = 0)：</text>
      <text x="10" y="34" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">• 植物只进行细胞呼吸，无光合作用</text>
      <text x="10" y="46" font-family="system-ui, sans-serif" font-size="8.5" fill="#dc2626">• 此时净光合速率绝对值 = 呼吸速率</text>
    </g>

    <!-- B 点 -->
    <g transform="translate(12, 100)">
      <rect width="251" height="60" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#1e40af">B 点 (光补偿点)：</text>
      <text x="10" y="34" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#2563eb">• 光合作用速率 = 细胞呼吸速率</text>
      <text x="10" y="46" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">• 净光合量 = 0，植株有机物不积累亦不减少</text>
      <text x="10" y="56" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">呼吸消耗 CO₂ 全部来自自身光合产生</text>
    </g>

    <!-- C 点 -->
    <g transform="translate(12, 168)">
      <rect width="251" height="60" rx="6" fill="#fffbeb" stroke="#fde68a"/>
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#b45309">C 点 (光饱和点)：</text>
      <text x="10" y="34" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">• 光合速率达到最大值，光强不再是限制因子</text>
      <text x="10" y="46" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#b45309">• 平台限制因子：CO₂ 浓度、环境温度、酶量</text>
      <text x="10" y="56" font-family="system-ui, sans-serif" font-size="8" fill="#78350f">若增加 CO₂ 浓度，C 点将向右上方移动！</text>
    </g>

    <!-- 黄金公式卡 -->
    <g transform="translate(12, 236)">
      <rect width="251" height="48" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="125.5" y="18" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#065f46" text-anchor="middle">★ 高考终极守恒公式</text>
      <text x="125.5" y="36" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#047857" text-anchor="middle">实际光合量 = 净光合量 + 呼吸消耗量</text>
    </g>
  </g>
</svg>
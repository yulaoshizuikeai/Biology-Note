<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <linearGradient id="head-evm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow-evm" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="780" height="370" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <g transform="translate(15, 12)">
    <rect width="750" height="38" rx="8" fill="url(#head-evm)"/>
    <text x="375" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      高考生物实验三大变量三角控制模型（单一变量与科学对照）
    </text>
  </g>

  <!-- 三角关系主图 -->
  <g transform="translate(15, 60)">
    <rect width="750" height="295" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow-evm)"/>

    <!-- 顶端：自变量 -->
    <g transform="translate(235, 15)">
      <rect width="280" height="75" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
      <text x="140" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">
        【自变量】(Independent Variable)
      </text>
      <text x="140" y="44" font-family="system-ui, sans-serif" font-size="9.5" fill="#1e3a8a" text-anchor="middle">
        实验者人为主动改变的实验因素
      </text>
      <text x="140" y="60" font-family="system-ui, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">
        如：不同温度梯度、不同激素浓度、有无添加某抑制剂
      </text>
    </g>

    <!-- 连线：自变量 -> 因变量 (因果) 带白底徽章 -->
    <g transform="translate(260, 95)">
      <line x1="0" y1="0" x2="-110" y2="65" stroke="#2563eb" stroke-width="2.5"/>
      <polygon points="-110,61 -116,68 -108,68" fill="#2563eb"/>
      <rect x="-135" y="18" width="116" height="20" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="-77" y="32" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#2563eb" text-anchor="middle">人为施加影响 (原因)</text>
    </g>

    <!-- 连线：自变量 -> 无关变量 带白底徽章 -->
    <g transform="translate(490, 95)">
      <line x1="0" y1="0" x2="110" y2="65" stroke="#64748b" stroke-width="2" stroke-dasharray="4,2"/>
      <polygon points="108,68 116,68 110,61" fill="#64748b"/>
      <rect x="25" y="18" width="100" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="75" y="32" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">独立于无关变量</text>
    </g>

    <!-- 左下：因变量 -->
    <g transform="translate(25, 175)">
      <rect width="320" height="95" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <text x="160" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#065f46" text-anchor="middle">
        【因变量】(Dependent Variable)
      </text>
      <text x="160" y="44" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#047857" text-anchor="middle">
        随自变量改变而改变的生理指标 (结果)
      </text>
      <text x="10" y="64" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">• 可直接测定：光合速率(O₂产生量)、液滴移动距离、菌落数</text>
      <text x="10" y="78" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">• 规范表达：严禁写含糊词“生长情况”，必须指明具体指标！</text>
    </g>

    <!-- 干扰连线：无关变量 -> 因变量 -->
    <g transform="translate(350, 220)">
      <line x1="50" y1="0" x2="0" y2="0" stroke="#dc2626" stroke-width="2"/>
      <polygon points="0,-4 -6,0 0,4" fill="#dc2626"/>
      <text x="25" y="-10" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#dc2626" text-anchor="middle">潜伏干扰！</text>
    </g>

    <!-- 右下：无关变量 -->
    <g transform="translate(405, 175)">
      <rect width="320" height="95" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
      <text x="160" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">
        【无关变量】(Confounding Variable)
      </text>
      <text x="160" y="44" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">
        除自变量外可能对因变量造成干扰的一切外在因素
      </text>
      <text x="10" y="64" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">• 控制准则：【相同且适宜】(各组保持完全一致)</text>
      <text x="10" y="78" font-family="system-ui, sans-serif" font-size="8.5" fill="#dc2626">• 排除误差：若控制不当会导致“假阳性/假阴性”破坏结论</text>
    </g>
  </g>
</svg>
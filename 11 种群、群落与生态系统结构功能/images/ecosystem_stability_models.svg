<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <linearGradient id="head-esm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow-esm" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="780" height="370" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <g transform="translate(15, 12)">
    <rect width="750" height="38" rx="8" fill="url(#head-esm)"/>
    <text x="375" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      生态系统稳定性双维对比模型（抵抗力稳定性 vs 恢复力稳定性）
    </text>
  </g>

  <!-- 左列：抵抗力稳定性 -->
  <g transform="translate(15, 60)">
    <rect width="365" height="235" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" filter="url(#shadow-esm)"/>
    <rect x="0" y="0" width="365" height="30" rx="10" fill="#2563eb"/>
    <text x="182.5" y="20" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
      抵抗力稳定性（Resistance Stability）
    </text>

    <g transform="translate(15, 42)">
      <rect width="335" height="46" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#1e40af">概念：抵抗干扰、保持原状的能力</text>
      <text x="10" y="34" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">受到外界干扰时，系统维持自身结构与功能不发生改变的能力</text>
    </g>

    <g transform="translate(15, 98)">
      <rect width="335" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">决定因素与规律：</text>
      <text x="10" y="34" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">• 物种组分越多，营养结构（食物网）越复杂</text>
      <text x="10" y="48" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">• 自我调节能力越强 ➔ 【抵抗力稳定性越高】！</text>
    </g>

    <g transform="translate(15, 172)">
      <rect width="335" height="48" rx="6" fill="#f0fdf4" stroke="#86efac"/>
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#15803d">经典生态系统实例：</text>
      <text x="10" y="34" font-family="system-ui, sans-serif" font-size="8.5" fill="#15803d">热带雨林（抵抗力极高，气候湿热、物种极其丰富）</text>
    </g>
  </g>

  <!-- 右列：恢复力稳定性 -->
  <g transform="translate(400, 60)">
    <rect width="365" height="235" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.2" filter="url(#shadow-esm)"/>
    <rect x="0" y="0" width="365" height="30" rx="10" fill="#16a34a"/>
    <text x="182.5" y="20" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
      恢复力稳定性（Resilience Stability）
    </text>

    <g transform="translate(15, 42)">
      <rect width="335" height="46" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#15803d">概念：遭到破坏、恢复原状的能力</text>
      <text x="10" y="34" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">系统遭受外界严重破坏后，重新恢复到稳态结构的能力</text>
    </g>

    <g transform="translate(15, 98)">
      <rect width="335" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">决定因素与规律：</text>
      <text x="10" y="34" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">• 通常与抵抗力稳定性呈【负相关】反向变动</text>
      <text x="10" y="48" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">• 结构简单的生态系统（如草原、农田），遭到破坏后恢复快</text>
    </g>

    <g transform="translate(15, 172)">
      <rect width="335" height="48" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#1e40af">经典生态系统实例：</text>
      <text x="10" y="34" font-family="system-ui, sans-serif" font-size="8.5" fill="#1e40af">草原生态系统（抵抗力弱于雨林，但火灾后恢复力强）</text>
    </g>
  </g>

  <!-- 底部：负相关例外与特例警示 -->
  <g transform="translate(15, 305)">
    <rect width="750" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <g transform="translate(15, 12)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#dc2626">★ 高考核心排雷点（负相关不是绝对的！）：</text>
      <text x="0" y="32" font-family="system-ui, sans-serif" font-size="9" fill="#334155">在环境条件极其严酷的生态系统中（如【北极苔原】、【极度干旱荒漠】），抵抗力稳定性极低，恢复力稳定性【也极低】！</text>
    </g>
  </g>
</svg>
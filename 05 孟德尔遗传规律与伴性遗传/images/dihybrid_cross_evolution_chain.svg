<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <linearGradient id="head-dec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow-dec" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="780" height="370" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <g transform="translate(15, 12)">
    <rect width="750" height="38" rx="8" fill="url(#head-dec)"/>
    <text x="375" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      两对相对性状杂交实验演进链与 9:3:3:1 表现型比例分布
    </text>
  </g>

  <!-- 上部：P 到 F1 再到 F2 演进链条 -->
  <g transform="translate(15, 60)">
    <rect width="750" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow-dec)"/>
    
    <!-- P 代 -->
    <g transform="translate(20, 20)">
      <rect width="160" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="80" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">亲本 P：纯种杂交</text>
      <text x="80" y="45" font-family="system-ui, sans-serif" font-size="10" fill="#78350f" text-anchor="middle">黄色圆粒(YYRR) × 绿色皱粒(yyrr)</text>
    </g>

    <!-- 箭头 1 -->
    <g transform="translate(185, 45)">
      <line x1="0" y1="5" x2="35" y2="5" stroke="#475569" stroke-width="2"/>
      <polygon points="35,2 41,5 35,8" fill="#475569"/>
      <text x="18" y="-3" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">杂交产生配子</text>
    </g>

    <!-- F1 代 -->
    <g transform="translate(230, 20)">
      <rect width="180" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="90" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">F₁ 代：双杂合子</text>
      <text x="90" y="45" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#1d4ed8" text-anchor="middle">黄色圆粒 (YyRr) · 显性完全显现</text>
    </g>

    <!-- 箭头 2 自交 -->
    <g transform="translate(415, 45)">
      <line x1="0" y1="5" x2="45" y2="5" stroke="#dc2626" stroke-width="2"/>
      <polygon points="45,2 51,5 45,8" fill="#dc2626"/>
      <text x="25" y="-3" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">⊗ 自交</text>
    </g>

    <!-- F2 代配子与受精 -->
    <g transform="translate(475, 15)">
      <rect width="255" height="70" rx="6" fill="#f0fdf4" stroke="#86efac"/>
      <text x="127.5" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">F₁ 产生 4 种雌雄配子 (1:1:1:1)</text>
      <text x="127.5" y="40" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155" text-anchor="middle">YR : Yr : yR : yr ＝ 1 : 1 : 1 : 1</text>
      <text x="127.5" y="58" font-family="system-ui, sans-serif" font-size="9" fill="#475569" text-anchor="middle">受精结合方式共 4×4＝16 种，合子基因型 9 种</text>
    </g>

    <!-- 实验结论说明横条 -->
    <g transform="translate(20, 95)">
      <rect width="710" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="15" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">微观分离实质：</text>
      <text x="95" y="24" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">减数分裂产生配子时，等位基因分离（Y与y、R与r），非等位基因自由组合（Y与R/r，y与R/r）</text>
    </g>
  </g>

  <!-- 下部：F2 代 9:3:3:1 表现型拆解卡片 -->
  <g transform="translate(15, 220)">
    <!-- 9 黄圆 -->
    <g transform="translate(0, 0)">
      <rect width="175" height="135" rx="8" fill="#fef9c3" stroke="#facc15" stroke-width="1.5" filter="url(#shadow-dec)"/>
      <rect x="0" y="0" width="175" height="28" rx="8" fill="#eab308"/>
      <text x="87.5" y="19" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
        黄色圆粒 (Y_R_) : 9
      </text>
      <g transform="translate(10, 36)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#854d0e">• 双显性表型</text>
        <text x="0" y="32" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">含 4 种基因型组合：</text>
        <text x="0" y="48" font-family="system-ui, sans-serif" font-size="8.5" fill="#713f12">1 YYRR (纯合)</text>
        <text x="0" y="62" font-family="system-ui, sans-serif" font-size="8.5" fill="#713f12">2 YyRR + 2 YYRr (单杂)</text>
        <text x="0" y="76" font-family="system-ui, sans-serif" font-size="8.5" fill="#713f12">4 YyRr (双杂)</text>
      </g>
    </g>

    <!-- 3 黄皱 -->
    <g transform="translate(190, 0)">
      <rect width="175" height="135" rx="8" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5" filter="url(#shadow-dec)"/>
      <rect x="0" y="0" width="175" height="28" rx="8" fill="#f97316"/>
      <text x="87.5" y="19" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
        黄色皱粒 (Y_rr) : 3
      </text>
      <g transform="translate(10, 36)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#9a3412">• 单显性重组类型</text>
        <text x="0" y="32" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">含 2 种基因型组合：</text>
        <text x="0" y="50" font-family="system-ui, sans-serif" font-size="8.5" fill="#9a3412">1 YYrr (纯合新重组)</text>
        <text x="0" y="68" font-family="system-ui, sans-serif" font-size="8.5" fill="#9a3412">2 Yyrr (单杂)</text>
      </g>
    </g>

    <!-- 3 绿圆 -->
    <g transform="translate(380, 0)">
      <rect width="175" height="135" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5" filter="url(#shadow-dec)"/>
      <rect x="0" y="0" width="175" height="28" rx="8" fill="#16a34a"/>
      <text x="87.5" y="19" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
        绿色圆粒 (yyR_) : 3
      </text>
      <g transform="translate(10, 36)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#14532d">• 单显性重组类型</text>
        <text x="0" y="32" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">含 2 种基因型组合：</text>
        <text x="0" y="50" font-family="system-ui, sans-serif" font-size="8.5" fill="#14532d">1 yyRR (纯合新重组)</text>
        <text x="0" y="68" font-family="system-ui, sans-serif" font-size="8.5" fill="#14532d">2 yyRr (单杂)</text>
      </g>
    </g>

    <!-- 1 绿皱 -->
    <g transform="translate(570, 0)">
      <rect width="180" height="135" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow-dec)"/>
      <rect x="0" y="0" width="180" height="28" rx="8" fill="#475569"/>
      <text x="90" y="19" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
        绿色皱粒 (yyrr) : 1
      </text>
      <g transform="translate(10, 36)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#1e293b">• 双隐性纯合亲本型</text>
        <text x="0" y="34" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">仅 1 种基因型：</text>
        <text x="0" y="52" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#0f172a">1 yyrr</text>
        <text x="0" y="74" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">重组性状占比：(3+3)/16 = 3/8</text>
      </g>
    </g>
  </g>
</svg>
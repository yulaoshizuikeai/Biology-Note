<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <linearGradient id="head-adm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow-adm" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="780" height="370" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <g transform="translate(15, 12)">
    <rect width="750" height="38" rx="8" fill="url(#head-adm)"/>
    <text x="375" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      生长素经典发现史五大里程碑科学探究逻辑链（1880 ~ 1934）
    </text>
  </g>

  <!-- 5 阶段卡片横向排布 -->
  <!-- 1. 达尔文 -->
  <g transform="translate(15, 60)">
    <rect width="138" height="295" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow-adm)"/>
    <rect x="0" y="0" width="138" height="28" rx="8" fill="#047857"/>
    <text x="69" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">
      达尔文实验 (1880)
    </text>
    <g transform="translate(8, 36)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#065f46">实验现象：</text>
      <text x="0" y="32" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">• 单侧光照 ➔ 向光弯曲</text>
      <text x="0" y="48" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">• 锡箔套遮尖 ➔ 直立生长</text>
      <text x="0" y="64" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">• 遮伸长区 ➔ 向光弯曲</text>

      <g transform="translate(0, 80)">
        <rect width="122" height="70" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
        <text x="6" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#047857">得出科学推论：</text>
        <text x="6" y="34" font-family="system-ui, sans-serif" font-size="8" fill="#334155">感光部位在【尖端】；</text>
        <text x="6" y="48" font-family="system-ui, sans-serif" font-size="8" fill="#334155">弯曲生长部位在</text>
        <text x="6" y="62" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#047857">【尖端下方伸长区】</text>
      </g>
    </g>
  </g>

  <g transform="translate(156, 190)"><text x="0" y="0" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#94a3b8">➔</text></g>

  <!-- 2. 鲍森·詹森 -->
  <g transform="translate(172, 60)">
    <rect width="145" height="295" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow-adm)"/>
    <rect x="0" y="0" width="145" height="28" rx="8" fill="#0284c7"/>
    <text x="72.5" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">
      鲍森·詹森 (1910)
    </text>
    <g transform="translate(8, 36)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#0369a1">实验现象：</text>
      <text x="0" y="32" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">• 尖端下垫【琼脂片】</text>
      <text x="8" y="46" font-family="system-ui, sans-serif" font-size="8.5" fill="#047857">➔ 仍能向光弯曲</text>
      <text x="0" y="62" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">• 尖端下垫【云母片】</text>
      <text x="8" y="76" font-family="system-ui, sans-serif" font-size="8.5" fill="#dc2626">➔ 不生长亦不弯曲</text>

      <g transform="translate(0, 90)">
        <rect width="129" height="70" rx="4" fill="#f0f9ff" stroke="#bae6fd"/>
        <text x="6" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#0284c7">得出科学推论：</text>
        <text x="6" y="34" font-family="system-ui, sans-serif" font-size="8" fill="#334155">胚芽鞘尖端产生的</text>
        <text x="6" y="48" font-family="system-ui, sans-serif" font-size="8" fill="#334155">“影响”是一种</text>
        <text x="6" y="62" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#0284c7">【可透过的化学物质】</text>
      </g>
    </g>
  </g>

  <g transform="translate(320, 190)"><text x="0" y="0" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#94a3b8">➔</text></g>

  <!-- 3. 拜尔 -->
  <g transform="translate(336, 60)">
    <rect width="138" height="295" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow-adm)"/>
    <rect x="0" y="0" width="138" height="28" rx="8" fill="#d97706"/>
    <text x="69" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">
      拜尔实验 (1914)
    </text>
    <g transform="translate(8, 36)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#b45309">实验现象：</text>
      <text x="0" y="32" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">• 在【完全黑暗】中</text>
      <text x="0" y="48" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">• 将切下的尖端</text>
      <text x="0" y="64" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">偏放于切面一侧</text>
      <text x="0" y="80" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#b45309">➔ 胚芽鞘向对侧弯曲</text>

      <g transform="translate(0, 95)">
        <rect width="122" height="70" rx="4" fill="#fffbeb" stroke="#fde68a"/>
        <text x="6" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#b45309">得出科学推论：</text>
        <text x="6" y="34" font-family="system-ui, sans-serif" font-size="8" fill="#334155">向光弯曲的实质是：</text>
        <text x="6" y="48" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#b45309">尖端产生的影响在</text>
        <text x="6" y="62" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#b45309">下部分布不均匀！</text>
      </g>
    </g>
  </g>

  <g transform="translate(477, 190)"><text x="0" y="0" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#94a3b8">➔</text></g>

  <!-- 4. 温特 -->
  <g transform="translate(493, 60)">
    <rect width="135" height="295" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow-adm)"/>
    <rect x="0" y="0" width="135" height="28" rx="8" fill="#dc2626"/>
    <text x="67.5" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">
      温特实验 (1928)
    </text>
    <g transform="translate(8, 36)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#b91c1c">实验设置：</text>
      <text x="0" y="32" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">• 接触尖端琼脂偏放</text>
      <text x="8" y="46" font-family="system-ui, sans-serif" font-size="8.5" fill="#047857">➔ 胚芽鞘弯曲生长</text>
      <text x="0" y="62" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">• 空白琼脂块偏放</text>
      <text x="8" y="76" font-family="system-ui, sans-serif" font-size="8.5" fill="#dc2626">➔ 不生长不弯曲(对照)</text>

      <g transform="translate(0, 90)">
        <rect width="119" height="70" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
        <text x="6" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#b91c1c">得出科学推论：</text>
        <text x="6" y="34" font-family="system-ui, sans-serif" font-size="8" fill="#334155">【确证化学物质存在】</text>
        <text x="6" y="48" font-family="system-ui, sans-serif" font-size="8" fill="#334155">并正式将其命名为</text>
        <text x="6" y="62" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#dc2626">【生长素 (Auxin)】</text>
      </g>
    </g>
  </g>

  <g transform="translate(631, 190)"><text x="0" y="0" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#94a3b8">➔</text></g>

  <!-- 5. 郭葛 -->
  <g transform="translate(647, 60)">
    <rect width="118" height="295" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.2" filter="url(#shadow-adm)"/>
    <rect x="0" y="0" width="118" height="28" rx="8" fill="#16a34a"/>
    <text x="59" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">
      郭葛实验 (1934)
    </text>
    <g transform="translate(8, 36)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#15803d">化学本质：</text>
      <text x="0" y="34" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">从人尿中分离提纯</text>
      <text x="0" y="50" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">出生长素纯品</text>

      <g transform="translate(0, 70)">
        <rect width="102" height="85" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="6" y="18" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#15803d">化学本质鉴定：</text>
        <text x="6" y="34" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#16a34a">【吲哚乙酸】</text>
        <text x="6" y="50" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#047857">(IAA)</text>
        <text x="6" y="66" font-family="system-ui, sans-serif" font-size="7.5" fill="#475569">由色氨酸转变而来</text>
        <text x="6" y="78" font-family="system-ui, sans-serif" font-size="7.5" fill="#475569">(微量高效调节物)</text>
      </g>
    </g>
  </g>
</svg>
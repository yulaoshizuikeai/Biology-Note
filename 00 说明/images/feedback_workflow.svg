<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <marker id="arr-b-fb" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e6b56"/>
    </marker>
  </defs>

  <rect width="780" height="370" fill="#faf9f5" rx="12" stroke="#e4e0d7" stroke-width="1.5"/>

  <!-- 标题栏 -->
  <g transform="translate(15, 16)">
    <rect x="0" y="0" width="750" height="38" rx="8" fill="#1e3a2f"/>
    <text x="375" y="25" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#faf9f5" text-anchor="middle">
      Yulaoshizuikeai's Biology Note 错误反馈与持续迭代闭环流程
    </text>
  </g>

  <!-- 流程四步走 -->
  <!-- 步骤 1 -->
  <g transform="translate(15, 68)">
    <rect x="0" y="0" width="170" height="232" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="170" height="30" rx="6" fill="#f0fdf4"/>
    <text x="85" y="20" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">1. 发现疑问 / 纰漏</text>
    <text x="14" y="58" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 术语概念或机制争议</text>
    <text x="14" y="90" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 图解标注或逻辑歧义</text>
    <text x="14" y="122" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 错别字与排版瑕疵</text>
    <text x="14" y="154" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">• 附截图与所在章节定位</text>
    <rect x="12" y="188" width="146" height="30" rx="15" fill="#f1f5f9"/>
    <text x="85" y="207" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">输出：问题工单</text>
  </g>

  <!-- 箭头 1 -->
  <g transform="translate(185, 184)">
    <line x1="0" y1="0" x2="23" y2="0" stroke="#2e6b56" stroke-width="2.6" marker-end="url(#arr-b-fb)"/>
  </g>

  <!-- 步骤 2 -->
  <g transform="translate(208, 68)">
    <rect x="0" y="0" width="170" height="232" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="170" height="30" rx="6" fill="#f0fdf4"/>
    <text x="85" y="20" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#2e6b56" text-anchor="middle">2. 提交反馈渠道</text>
    <text x="14" y="58" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• GitHub Issues 提交</text>
    <text x="14" y="90" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 页面底部评论留言</text>
    <text x="14" y="122" font-family="system-ui, sans-serif" font-size="10" fill="#2e6b56">• 邮件附截图直达维护者</text>
    <text x="14" y="154" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">• 一次说清预期与实际差异</text>
    <rect x="12" y="188" width="146" height="30" rx="15" fill="#f0fdf4"/>
    <text x="85" y="207" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#166534" text-anchor="middle">输出：Issue 记录</text>
  </g>

  <!-- 箭头 2 -->
  <g transform="translate(378, 184)">
    <line x1="0" y1="0" x2="23" y2="0" stroke="#2e6b56" stroke-width="2.6" marker-end="url(#arr-b-fb)"/>
  </g>

  <!-- 步骤 3 -->
  <g transform="translate(401, 68)">
    <rect x="0" y="0" width="170" height="232" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="170" height="30" rx="6" fill="#fef2f2"/>
    <text x="85" y="20" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">3. 严密教研复核</text>
    <text x="14" y="58" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 教材与课标严格核验</text>
    <text x="14" y="90" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 生理生化事实考证</text>
    <text x="14" y="122" font-family="system-ui, sans-serif" font-size="10" fill="#dc2626">• 确定修正优化方案</text>
    <text x="14" y="154" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">• 高考真题口径交叉验证</text>
    <rect x="12" y="188" width="146" height="30" rx="15" fill="#fef2f2"/>
    <text x="85" y="207" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">输出：修正方案</text>
  </g>

  <!-- 箭头 3 -->
  <g transform="translate(571, 184)">
    <line x1="0" y1="0" x2="23" y2="0" stroke="#2e6b56" stroke-width="2.6" marker-end="url(#arr-b-fb)"/>
  </g>

  <!-- 步骤 4 -->
  <g transform="translate(594, 68)">
    <rect x="0" y="0" width="170" height="232" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="170" height="30" rx="6" fill="#f3f1ec"/>
    <text x="85" y="20" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1e3a2f" text-anchor="middle">4. 合并更新发布</text>
    <text x="14" y="58" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• Git 仓库提交合并</text>
    <text x="14" y="90" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 全站静态构建发布</text>
    <text x="14" y="122" font-family="system-ui, sans-serif" font-size="10" fill="#2e6b56">• 感谢贡献者致谢记录</text>
    <text x="14" y="154" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">• 版本号与更新日志同步</text>
    <rect x="12" y="188" width="146" height="30" rx="15" fill="#1e3a2f"/>
    <text x="85" y="207" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#faf9f5" text-anchor="middle">输出：新版发布</text>
  </g>

  <!-- 底部说明条 -->
  <g transform="translate(15, 312)">
    <rect x="0" y="0" width="750" height="42" rx="6" fill="#1e3a2f"/>
    <text x="375" y="27" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#faf9f5" text-anchor="middle">
      致谢：感谢每一位细心读者的反馈与指正，共同打造最严谨、系统的高中生物知识库！
    </text>
  </g>
</svg>

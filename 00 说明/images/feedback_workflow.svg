<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="100%" height="100%">
  <defs>
    <marker id="arr-b-fb" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e6b56"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf9f5" rx="12" stroke="#e4e0d7" stroke-width="1.5"/>

  <!-- 标题 -->
  <rect x="20" y="12" width="720" height="32" rx="6" fill="#1e3a2f"/>
  <text x="380" y="33" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#faf9f5" text-anchor="middle">
    Yulaoshizuikeai's Biology Note 错误反馈与持续迭代闭环流程
  </text>

  <!-- 流程四步走 -->
  <!-- 步骤 1 -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="150" height="105" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="150" height="26" rx="6" fill="#f0fdf4"/>
    <text x="75" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">1. 发现疑问/纰漏</text>
    <text x="12" y="48" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 术语概念或机制争议</text>
    <text x="12" y="68" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 图解标注或逻辑歧义</text>
    <text x="12" y="88" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">• 错别字与排版瑕疵</text>
  </g>

  <!-- 箭头 1 -->
  <line x1="185" y1="112" x2="210" y2="112" stroke="#2e6b56" stroke-width="2.6" marker-end="url(#arr-b-fb)"/>

  <!-- 步骤 2 -->
  <g transform="translate(215, 60)">
    <rect x="0" y="0" width="150" height="105" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="150" height="26" rx="6" fill="#f0fdf4"/>
    <text x="75" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2e6b56" text-anchor="middle">2. 提交反馈渠道</text>
    <text x="12" y="48" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• GitHub Issues 提交</text>
    <text x="12" y="68" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 页面底部评论留言</text>
    <text x="12" y="88" font-family="system-ui, sans-serif" font-size="10" fill="#2e6b56">• 邮件附截图直达维护者</text>
  </g>

  <!-- 箭头 2 -->
  <line x1="370" y1="112" x2="395" y2="112" stroke="#2e6b56" stroke-width="2.6" marker-end="url(#arr-b-fb)"/>

  <!-- 步骤 3 -->
  <g transform="translate(400, 60)">
    <rect x="0" y="0" width="150" height="105" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="150" height="26" rx="6" fill="#fef2f2"/>
    <text x="75" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">3. 严密教研复核</text>
    <text x="12" y="48" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 教材与课标严格核验</text>
    <text x="12" y="68" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 生理生化事实考证</text>
    <text x="12" y="88" font-family="system-ui, sans-serif" font-size="10" fill="#dc2626">• 确定修正优化方案</text>
  </g>

  <!-- 箭头 3 -->
  <line x1="555" y1="112" x2="580" y2="112" stroke="#2e6b56" stroke-width="2.6" marker-end="url(#arr-b-fb)"/>

  <!-- 步骤 4 -->
  <g transform="translate(585, 60)">
    <rect x="0" y="0" width="145" height="105" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="145" height="26" rx="6" fill="#f3f1ec"/>
    <text x="72" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e3a2f" text-anchor="middle">4. 合并更新发布</text>
    <text x="10" y="48" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• Git 仓库提交合并</text>
    <text x="10" y="68" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 全站静态构建发布</text>
    <text x="10" y="88" font-family="system-ui, sans-serif" font-size="10" fill="#2e6b56">• 感谢贡献者致谢记录</text>
  </g>

  <!-- 底部说明条 -->
  <rect x="20" y="180" width="720" height="26" rx="5" fill="#1e3a2f"/>
  <text x="380" y="197" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#faf9f5" text-anchor="middle">
    致谢：感谢每一位细心读者的反馈与指正，共同打造最严谨、系统的高中生物知识库！
  </text>
</svg>

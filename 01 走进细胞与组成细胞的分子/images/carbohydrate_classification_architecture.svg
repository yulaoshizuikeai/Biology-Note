<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <linearGradient id="c-head-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="c-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="shadow-1" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="780" height="370" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <g transform="translate(15, 12)">
    <rect width="750" height="38" rx="8" fill="url(#c-head-1)"/>
    <text x="375" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      糖类的三级分类体系与微观生理定位全景图
    </text>
  </g>

  <!-- 左列：单糖 (Monosaccharides) -->
  <g transform="translate(15, 60)">
    <rect width="240" height="295" rx="10" fill="url(#c-card-grad)" stroke="#a7f3d0" stroke-width="1.2" filter="url(#shadow-1)"/>
    <rect x="0" y="0" width="240" height="32" rx="10" fill="#047857"/>
    <text x="120" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      1. 单糖 (不能再水解)
    </text>

    <!-- 五碳糖 -->
    <g transform="translate(10, 42)">
      <rect width="220" height="110" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="220" height="24" rx="6" fill="#d1fae5"/>
      <text x="10" y="16" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#065f46">五碳糖 (C₅H₁₀O₅ / C₅H₁₀O₄)</text>
      <text x="10" y="44" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0f766e">• 核糖 (Ribose, C₅H₁₀O₅)</text>
      <text x="20" y="60" font-family="system-ui, sans-serif" font-size="9" fill="#475569">RNA 的核心骨架构件、ATP组成部分</text>
      <text x="10" y="80" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0f766e">• 脱氧核糖 (Deoxyribose, C₅H₁₀O₄)</text>
      <text x="20" y="96" font-family="system-ui, sans-serif" font-size="9" fill="#475569">DNA 的主链基本骨架构件 (2号碳脱氧)</text>
    </g>

    <!-- 六碳糖 -->
    <g transform="translate(10, 162)">
      <rect width="220" height="120" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="220" height="24" rx="6" fill="#d1fae5"/>
      <text x="10" y="16" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#065f46">六碳糖 (C₆H₁₂O₆)</text>
      <text x="10" y="44" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0f766e">• 葡萄糖 (Glucose)</text>
      <text x="20" y="60" font-family="system-ui, sans-serif" font-size="9" fill="#475569">细胞生命的“主要能源燃料”，还原糖</text>
      <text x="10" y="80" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0f766e">• 果糖 (Fructose) 与 半乳糖 (Galactose)</text>
      <text x="20" y="96" font-family="system-ui, sans-serif" font-size="9" fill="#475569">果糖多见于植物果实；半乳糖多见于乳汁</text>
      <text x="10" y="112" font-family="system-ui, sans-serif" font-size="8.5" fill="#dc2626">注：单糖均具有还原性 (能与斐林试剂反应)</text>
    </g>
  </g>

  <!-- 中列：二糖 (Disaccharides) -->
  <g transform="translate(270, 60)">
    <rect width="240" height="295" rx="10" fill="url(#c-card-grad)" stroke="#bae6fd" stroke-width="1.2" filter="url(#shadow-1)"/>
    <rect x="0" y="0" width="240" height="32" rx="10" fill="#0284c7"/>
    <text x="120" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      2. 二糖 (水解生成2分子单糖)
    </text>

    <!-- 植物二糖 -->
    <g transform="translate(10, 42)">
      <rect width="220" height="110" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="220" height="24" rx="6" fill="#e0f2fe"/>
      <text x="10" y="16" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#0369a1">植物二糖 (植物细胞特有)</text>
      <text x="10" y="44" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0284c7">• 蔗糖 (Sucrose)</text>
      <text x="20" y="58" font-family="system-ui, sans-serif" font-size="9" fill="#475569">葡萄糖 + 果糖；甘蔗/甜菜丰富</text>
      <text x="20" y="72" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#dc2626">★ 警示：蔗糖是【非还原糖】！</text>
      <text x="10" y="90" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0284c7">• 麦芽糖 (Maltose)</text>
      <text x="20" y="104" font-family="system-ui, sans-serif" font-size="9" fill="#475569">葡萄糖 + 葡萄糖；发芽发酵产物 (还原糖)</text>
    </g>

    <!-- 动物二糖 -->
    <g transform="translate(10, 162)">
      <rect width="220" height="120" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="220" height="24" rx="6" fill="#e0f2fe"/>
      <text x="10" y="16" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#0369a1">动物二糖 (动物特有)</text>
      <text x="10" y="44" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0284c7">• 乳糖 (Lactose)</text>
      <text x="20" y="60" font-family="system-ui, sans-serif" font-size="9" fill="#475569">葡萄糖 + 半乳糖；哺乳动物乳汁中</text>
      <text x="20" y="76" font-family="system-ui, sans-serif" font-size="9" fill="#475569">为幼仔生长提供必需能量 (还原糖)</text>
      <rect x="10" y="88" width="200" height="24" rx="4" fill="#fef2f2" stroke="#fecaca"/>
      <text x="110" y="104" font-family="system-ui, sans-serif" font-size="8.5" fill="#b91c1c" text-anchor="middle">考点：二糖必须水解为单糖才能被细胞吸收</text>
    </g>
  </g>

  <!-- 右列：多糖 (Polysaccharides) -->
  <g transform="translate(525, 60)">
    <rect width="240" height="295" rx="10" fill="url(#c-card-grad)" stroke="#fed7aa" stroke-width="1.2" filter="url(#shadow-1)"/>
    <rect x="0" y="0" width="240" height="32" rx="10" fill="#d97706"/>
    <text x="120" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      3. 多糖 (单体均为葡萄糖/衍生物)
    </text>

    <!-- 植物多糖 -->
    <g transform="translate(10, 42)">
      <rect width="220" height="74" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="220" height="22" rx="6" fill="#fef3c7"/>
      <text x="10" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#b45309">植物多糖</text>
      <text x="10" y="38" font-family="system-ui, sans-serif" font-size="9.5" fill="#1e293b">• 淀粉：植物细胞主要的储能大分子</text>
      <text x="10" y="54" font-family="system-ui, sans-serif" font-size="9.5" fill="#1e293b">• 纤维素：植物细胞壁核心支持骨架 (不供能)</text>
      <text x="10" y="68" font-family="system-ui, sans-serif" font-size="8.5" fill="#dc2626">注：淀粉与纤维素单体相同，但连接方式不同</text>
    </g>

    <!-- 动物多糖 -->
    <g transform="translate(10, 124)">
      <rect width="220" height="78" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="220" height="22" rx="6" fill="#fef3c7"/>
      <text x="10" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#b45309">动物多糖 (糖原 Glycogen)</text>
      <text x="10" y="38" font-family="system-ui, sans-serif" font-size="9.5" fill="#1e293b">• 肝糖原：可水解生成葡萄糖直接补充血糖</text>
      <text x="10" y="54" font-family="system-ui, sans-serif" font-size="9.5" fill="#1e293b">• 肌糖原：肌细胞自用，不能直接分解为葡萄糖</text>
      <text x="10" y="70" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748b">(肌糖原需经糖酵解生成乳酸后转至肝脏转换)</text>
    </g>

    <!-- 几丁质 -->
    <g transform="translate(10, 210)">
      <rect width="220" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="220" height="22" rx="6" fill="#fef3c7"/>
      <text x="10" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#b45309">几丁质 (Chitin / 壳多糖)</text>
      <text x="10" y="38" font-family="system-ui, sans-serif" font-size="9.5" fill="#1e293b">• 存在：甲壳类外骨骼与真菌细胞壁</text>
      <text x="10" y="54" font-family="system-ui, sans-serif" font-size="9.5" fill="#1e293b">• 应用：重金属废水吸附、人工皮肤与缝合线</text>
      <text x="10" y="68" font-family="system-ui, sans-serif" font-size="8.5" fill="#d97706">含 N 元素的特殊多糖大分子</text>
    </g>
  </g>
</svg>
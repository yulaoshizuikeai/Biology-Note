<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <linearGradient id="head-fmm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="shadow-fmm" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="780" height="370" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <g transform="translate(15, 12)">
    <rect width="750" height="38" rx="8" fill="url(#head-fmm)"/>
    <text x="375" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      细胞膜流动镶嵌模型（Fluid Mosaic Model）微观空间架构法则
    </text>
  </g>

  <!-- 左卡片：磷脂双分子层基本支架 -->
  <g transform="translate(15, 60)">
    <rect width="240" height="295" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" filter="url(#shadow-fmm)"/>
    <rect x="0" y="0" width="240" height="32" rx="10" fill="#2563eb"/>
    <text x="120" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      1. 磷脂双分子层 (基本支架)
    </text>

    <g transform="translate(12, 45)">
      <circle cx="25" cy="20" r="14" fill="#60a5fa" stroke="#2563eb" stroke-width="1.5"/>
      <text x="50" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">亲水性极性头部</text>
      <text x="50" y="32" font-family="system-ui, sans-serif" font-size="9" fill="#475569">带电荷磷酸基团，朝向膜外/内水相</text>

      <path d="M 20 34 Q 15 55 20 75 M 29 34 Q 35 55 30 75" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
      <text x="50" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#b45309">疏水性脂肪酸尾部</text>
      <text x="50" y="74" font-family="system-ui, sans-serif" font-size="9" fill="#475569">长链烃链，两两相对形成膜核心屏障</text>
    </g>

    <g transform="translate(12, 140)">
      <rect width="216" height="135" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="10" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">◆ 屏障特性与物理状态：</text>
      <text x="10" y="44" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">• 脂溶性分子（O₂, CO₂, 甘油, 固醇）</text>
      <text x="18" y="58" font-family="system-ui, sans-serif" font-size="9" fill="#2563eb">顺浓度自由扩散直接穿越疏水核心</text>
      <text x="10" y="78" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">• 离子与水溶性大分子被阻隔</text>
      <text x="18" y="92" font-family="system-ui, sans-serif" font-size="9" fill="#dc2626">必须依赖跨膜蛋白质协助跨膜</text>
      <text x="10" y="112" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">• 流动性机制：磷脂分子可侧向滑动</text>
      <text x="18" y="126" font-family="system-ui, sans-serif" font-size="8.5" fill="#047857">温度升高流动性增大，固醇调节流动刚性</text>
    </g>
  </g>

  <!-- 中卡片：膜蛋白的镶嵌分布 -->
  <g transform="translate(270, 60)">
    <rect width="240" height="295" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow-fmm)"/>
    <rect x="0" y="0" width="240" height="32" rx="10" fill="#475569"/>
    <text x="120" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      2. 膜蛋白 (功能承担者)
    </text>

    <g transform="translate(12, 45)">
      <rect width="216" height="70" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="8" y="8" width="55" height="18" rx="4" fill="#10b981"/>
      <text x="35.5" y="21" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">镶在表面</text>
      <text x="70" y="21" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">部分附着于膜内/外侧亲水表面</text>
      <text x="10" y="44" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">• 多充当骨架支撑锚定或外周酶催化</text>
      <text x="10" y="60" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">• 结合疏松，易受细胞内信号调控</text>
    </g>

    <g transform="translate(12, 125)">
      <rect width="216" height="70" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="8" y="8" width="55" height="18" rx="4" fill="#f59e0b"/>
      <text x="35.5" y="21" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">嵌入内部</text>
      <text x="70" y="21" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">部分伸入疏水性烃链核心</text>
      <text x="10" y="44" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">• 疏水侧链与脂肪酸尾部紧密咬合</text>
      <text x="10" y="60" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">• 保持膜内部构象稳定与特化酶活性</text>
    </g>

    <g transform="translate(12, 205)">
      <rect width="216" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="8" y="8" width="55" height="18" rx="4" fill="#6366f1"/>
      <text x="35.5" y="21" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">贯穿全膜</text>
      <text x="70" y="21" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">横跨全膜连接细胞内外水相</text>
      <text x="10" y="44" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">• 水通道蛋白、离子通道、转运载体</text>
      <text x="10" y="60" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">• 跨膜受体 (如胰岛素受体、神经递质受体)</text>
    </g>
  </g>

  <!-- 右卡片：膜的不对称性与糖被 -->
  <g transform="translate(525, 60)">
    <rect width="240" height="295" rx="10" fill="#ffffff" stroke="#fbcfe8" stroke-width="1.2" filter="url(#shadow-fmm)"/>
    <rect x="0" y="0" width="240" height="32" rx="10" fill="#db2777"/>
    <text x="120" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      3. 膜不对称性与糖被
    </text>

    <g transform="translate(12, 45)">
      <rect width="216" height="100" rx="6" fill="#fdf2f8" stroke="#f472b6" stroke-width="1"/>
      <text x="10" y="22" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#9d174d">★ 糖被（Glycocalyx）唯一金标准</text>
      <text x="10" y="42" font-family="system-ui, sans-serif" font-size="9.5" fill="#374151">• 化学成分：短糖链 + 蛋白质 / 脂质</text>
      <text x="18" y="56" font-family="system-ui, sans-serif" font-size="9" fill="#be185d">形成糖蛋白 (Glycoprotein) 或 糖脂</text>
      <text x="10" y="74" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#e11d48">• 绝对定位：仅分布于【细胞膜外表面】！</text>
      <text x="18" y="90" font-family="system-ui, sans-serif" font-size="8.5" fill="#be123c">高考解题必背：有糖被的一侧必为【膜外侧】</text>
    </g>

    <g transform="translate(12, 155)">
      <rect width="216" height="120" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#047857">糖被的核心生理功能：</text>
      <text x="10" y="40" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">1. 细胞识别与信息交流（如精卵识别）</text>
      <text x="10" y="60" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">2. 保护润滑作用（消化道上皮细胞）</text>
      <text x="10" y="80" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">3. 免疫监控（癌细胞表面糖蛋白减少，</text>
      <text x="24" y="94" font-family="system-ui, sans-serif" font-size="9" fill="#b91c1c">导致黏着性降低，易扩散转移！）</text>
      <text x="10" y="112" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748b">高考核心题型：显微图像内外侧判读</text>
    </g>
  </g>
</svg>
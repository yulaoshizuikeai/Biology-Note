<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <linearGradient id="head-c07" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow-c07" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="780" height="370" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <g transform="translate(15, 12)">
    <rect width="750" height="38" rx="8" fill="url(#head-c07)"/>
    <text x="375" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      专题 07 生物的变异、育种与现代生物进化理论 · 章节全景脉络导图
    </text>
  </g>

  <!-- 根节点 -->
  <g transform="translate(250, 60)">
    <rect width="280" height="40" rx="8" fill="#1e293b" stroke="#334155" filter="url(#shadow-c07)"/>
    <text x="140" y="25" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      🌱 变异、育种与进化体系
    </text>
  </g>

  <!-- 连线 -->
  <g transform="translate(390, 100)">
    <line x1="0" y1="0" x2="-250" y2="40" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="40" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="0" x2="250" y2="40" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- 篇章 1 -->
  <g transform="translate(15, 140)">
    <rect width="235" height="215" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow-c07)"/>
    <rect x="0" y="0" width="235" height="28" rx="8" fill="#dc2626"/>
    <text x="117.5" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
      01 基因突变与基因重组微观机理
    </text>

    <g transform="translate(12, 36)">
      <g transform="translate(0, 0)">
        <rect width="211" height="50" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
        <text x="8" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#b91c1c">基因突变：根本来源</text>
        <text x="8" y="31" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">碱基替换、增添、缺失 ➔ 新基因产生</text>
        <text x="8" y="43" font-family="system-ui, sans-serif" font-size="8" fill="#7f1d1d">普遍性、随机性、不定向性、低频性</text>
      </g>

      <g transform="translate(0, 56)">
        <rect width="211" height="50" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
        <text x="8" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#b91c1c">基因重组：主要来源</text>
        <text x="8" y="31" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">非等位自由组合 + 四分体交叉互换</text>
        <text x="8" y="43" font-family="system-ui, sans-serif" font-size="8" fill="#047857">产生新基因型，不产生新基因！</text>
      </g>

      <g transform="translate(0, 112)">
        <rect width="211" height="46" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="8" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#0f172a">微观辨析核心：</text>
        <text x="8" y="33" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">突变不一定改变生物性状 (密码子简并)</text>
      </g>
    </g>
  </g>

  <!-- 篇章 2 -->
  <g transform="translate(270, 140)">
    <rect width="240" height="215" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow-c07)"/>
    <rect x="0" y="0" width="240" height="28" rx="8" fill="#d97706"/>
    <text x="120" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
      02 染色体变异与现代育种方案
    </text>

    <g transform="translate(12, 36)">
      <g transform="translate(0, 0)">
        <rect width="216" height="50" rx="4" fill="#fffbeb" stroke="#fde68a"/>
        <text x="8" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#b45309">染色体结构与数目变异</text>
        <text x="8" y="31" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">缺失/重复/倒位/易位 (显微镜可见)</text>
        <text x="8" y="43" font-family="system-ui, sans-serif" font-size="8" fill="#78350f">单倍体、二倍体与多倍体界定</text>
      </g>

      <g transform="translate(0, 56)">
        <rect width="216" height="50" rx="4" fill="#fffbeb" stroke="#fde68a"/>
        <text x="8" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#b45309">五大现代育种方案对比</text>
        <text x="8" y="31" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">杂交/诱变/单倍体/多倍体/基因工程</text>
        <text x="8" y="43" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">秋水仙素抑制纺锤体形成机理</text>
      </g>

      <g transform="translate(0, 112)">
        <rect width="216" height="46" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="8" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#0f172a">育种年限决策：</text>
        <text x="8" y="33" font-family="system-ui, sans-serif" font-size="8" fill="#047857">单倍体育种 (花药离体培养) 明显缩短年限</text>
      </g>
    </g>
  </g>

  <!-- 篇章 3 -->
  <g transform="translate(530, 140)">
    <rect width="235" height="215" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow-c07)"/>
    <rect x="0" y="0" width="235" height="28" rx="8" fill="#059669"/>
    <text x="117.5" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
      03 现代生物进化理论与基因频率
    </text>

    <g transform="translate(12, 36)">
      <g transform="translate(0, 0)">
        <rect width="211" height="50" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
        <text x="8" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#047857">现代进化理论四大支柱</text>
        <text x="8" y="31" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">种群为基本单位；突变与重组供原料</text>
        <text x="8" y="43" font-family="system-ui, sans-serif" font-size="8" fill="#065f46">自然选择定方向；隔离致物种形成</text>
      </g>

      <g transform="translate(0, 56)">
        <rect width="211" height="50" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
        <text x="8" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#047857">基因频率与哈代-温伯格定律</text>
        <text x="8" y="31" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">p + q = 1，p² + 2pq + q² = 1</text>
        <text x="8" y="43" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">伴性遗传基因频率特别计算模型</text>
      </g>

      <g transform="translate(0, 112)">
        <rect width="211" height="46" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="8" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#0f172a">进化的实质：</text>
        <text x="8" y="33" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">种群基因频率发生定向改变即为进化！</text>
      </g>
    </g>
  </g>
</svg>